AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: TotalHub demo request API Gateway + Lambda.

Parameters:
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Origem liberada no CORS. Use o dominio do site em producao.
  SmtpHost:
    Type: String
    Description: Servidor SMTP.
  SmtpPort:
    Type: String
    Default: "587"
    Description: Porta SMTP.
  SmtpUsername:
    Type: String
    Default: ""
    Description: Usuario SMTP. Deixe vazio se o servidor nao exigir login.
  SmtpPassword:
    Type: String
    Default: ""
    NoEcho: true
    Description: Senha SMTP. Deixe vazio se o servidor nao exigir login.
  SmtpFromEmail:
    Type: String
    Description: Remetente usado no envio do e-mail.
  SmtpToEmails:
    Type: String
    Description: Destinatarios separados por ponto e virgula.
  SmtpUseTls:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Define se a conexao SMTP usa STARTTLS.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128
    Architectures:
      - x86_64

Resources:
  DemoRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.handler.lambda_handler
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          SMTP_HOST: !Ref SmtpHost
          SMTP_PORT: !Ref SmtpPort
          SMTP_USERNAME: !Ref SmtpUsername
          SMTP_PASSWORD: !Ref SmtpPassword
          SMTP_FROM_EMAIL: !Ref SmtpFromEmail
          SMTP_TO_EMAILS: !Ref SmtpToEmails
          SMTP_USE_TLS: !Ref SmtpUseTls
      Events:
        DemoRequestApi:
          Type: HttpApi
          Properties:
            Path: /solicitar-demonstracao
            Method: POST
        DemoRequestOptions:
          Type: HttpApi
          Properties:
            Path: /solicitar-demonstracao
            Method: OPTIONS

Outputs:
  DemoRequestApiUrl:
    Description: URL para configurar em VITE_DEMO_REQUEST_API_URL.
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/solicitar-demonstracao"
